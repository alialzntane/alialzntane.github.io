/* تحميل الحسابات */

async function load(){

try{

const snapshot=
await getDocs(
collection(db,"accounts")
);


allAccounts=
snapshot.docs.map(doc=>({

id:doc.id,
...doc.data()

allAccounts.sort((a,b)=>{

Number(a.createdAt || 0);

b.createdAt?.toMillis
