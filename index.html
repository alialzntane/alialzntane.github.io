<style>
*{box-sizing:border-box}
:root{--bg:#050a10;--panel:#0b1420;--panel2:#0f1a27;--line:#26384c;--gold:#f4c21b;--muted:#9aa8b8}
body{margin:0;min-height:100vh;background:#050a10;color:#fff;font-family:Arial,Tahoma,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 0,#182b40 0,#07101a 38%,#050a10 75%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.35;background:linear-gradient(135deg,transparent 45%,#102033 50%,transparent 55%)}
button,input{font:inherit}
button{cursor:pointer}
.site{width:min(1180px,96vw);margin:auto;padding:18px 0 35px}
.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border:1px solid #1e3043;border-radius:22px;background:rgba(5,13,22,.92);box-shadow:0 15px 45px #0008}
.top-icon{width:45px;height:45px;border:0;background:transparent;color:#fff;font-size:30px}
.top-logo{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #8f6d0a;box-shadow:0 0 25px #d5a70044}
.hero{display:grid;grid-template-columns:1fr 1.35fr;gap:22px;margin-top:18px;align-items:start}
.intro,.catalog{border:1px solid #213349;border-radius:28px;background:rgba(7,15,24,.91);box-shadow:0 20px 70px #0007}
.intro{padding:28px 28px 34px;text-align:center;min-height:700px}
.big-logo{width:185px;height:185px;border-radius:50%;object-fit:cover;border:2px solid #9a760b;box-shadow:0 0 35px #d2a40038;margin:0 auto 20px}
h1{font-size:40px;letter-spacing:1px;margin:0}

.social:hover{border-color:var(--gold);transform:translateY(-2px)}
.social-icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:26px}
.t{background:#111927}.w{background:#123d2c}.tg{background:#123b55}.game{background:#182231}
.browse{margin-top:25px;padding-top:22px;border-top:1px solid #26384c}
.browse-title{font-size:28px;font-weight:900;margin-bottom:10px}
.browse-sub{color:var(--muted);font-size:14px}
.catalog{padding:25px 24px}
.catalog-title{font-size:32px;font-weight:900;margin:0 0 18px}
.search{position:relative;margin-bottom:15px}
.search input{width:100%;height:55px;border-radius:17px;border:1px solid #30455d;background:#08121d;color:#fff;padding:0 52px 0 16px;outline:none}
.search span{position:absolute;right:17px;top:12px;font-size:26px;color:#91a1b3}
.filters{display:flex;gap:9px;overflow:auto;padding-bottom:8px;margin-bottom:10px}
.filter{white-space:nowrap;border:1px solid #273b52;background:#09131f;color:#fff;border-radius:22px;padding:10px 18px}
.filter.active{border-color:var(--gold);color:#ffd83d;box-shadow:0 0 14px #e4b3002c}
.accounts{display:grid;gap:16px}
.account{position:relative;border:1px solid #23384e;border-radius:22px;background:linear-gradient(135deg,#0d1825,#09121c);padding:17px;overflow:hidden}
.account:hover{border-color:#8c6c12}
.account-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.account-title{font-size:20px;font-weight:900}.crown{color:#ffd22e;font-size:21px}
.account-main{display:grid;grid-template-columns:185px 1fr;gap:15px;align-items:center}
.account-img{width:100%;height:175px;object-fit:cover;border-radius:16px;border:1px solid #3a4b5e;background:#0a111a;cursor:pointer}
.meta{display:grid;gap:8px;color:#d9e0e7;font-size:15px}
.meta div{display:flex;align-items:center;gap:7px}
.meta b{color:#fff}.meta .value{color:#dce5ee}
.account-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.price{font-size:29px;font-weight:900;color:#ffc928}
.details{border:1px solid var(--gold);background:#111b27;color:#ffd43a;border-radius:14px;padding:11px 18px;font-weight:900}
.details:hover{background:#2a2410}
.empty,.loading{text-align:center;color:#8392a4;padding:35px}
footer{text-align:center;color:#687486;font-size:12px;margin-top:18px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;border:1px solid #3a4654;border-radius:25px;background:#09131e;padding:22px;box-shadow:0 30px 90px #000}
.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#1b2735;color:#fff;border-radius:12px;width:42px;height:42px;font-size:22px}
.modal h2{margin:0}.modal-img{width:100%;max-height:300px;object-fit:cover;border-radius:17px;margin:15px 0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail-item{background:#111d2a;border-radius:12px;padding:10px;font-size:14px}.wa{display:block;text-align:center;text-decoration:none;margin-top:15px;background:#16864d;color:#fff;padding:14px;border-radius:14px;font-weight:900}
@media(max-width:850px){
 .site{width:min(94vw,620px)}
 .hero{grid-template-columns:1fr}
 .intro{min-height:auto}
 .topbar{height:72px}
 .top-logo{width:58px;height:58px}
 .big-logo{width:155px;height:155px}
 h1{font-size:30px}

}
@media(max-width:520px){

 .account-img{height:125px}

 .detail-grid{grid-template-columns:1fr}
}

/* بطاقة الحساب - شكل قريب من التصميم المرجعي */

@media(max-width:520px){
 .account-main{grid-template-columns:125px minmax(0,1fr)!important}
 .account-img{height:125px!important}
 .account-title{font-size:19px}
 .meta{gap:7px}
 .meta div{font-size:12.5px}
}

</style>

<body>
<div class="site">
<header class="topbar">
<button class="top-icon" aria-label="القائمة">☰</button>

<div class="modal" id="modal">

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyD1W0255eoUqKur7PohKhm_Z83oj43wTVI",
 authDomain:"ali-pubg-4418e.firebaseapp.com",
 projectId:"ali-pubg-4418",
 storageBucket:"ali-pubg-4418.firebasestorage.app",
 messagingSenderId:"859531411276",
 appId:"1:859531411276:web:445f957d53c22ca4bb59e9"
};
const db=getFirestore(initializeApp(firebaseConfig));
let allAccounts=[];
let currentFilter="all";

function escapeHTML(value){
 const div=document.createElement("div"); div.textContent=value ?? ""; return div.innerHTML;
}
function val(a,...keys){
 for(const k of keys) if(a[k]!==undefined && a[k]!==null && a[k]!=="") return a[k];
 return "-";
}
function imageOf(a){
 if(Array.isArray(a.images)&&a.images.length){
  const x=a.images[0]; return typeof x==="string"?x:(x?.url||"");
 }
 return a.image||a.photo||"";
}
function priceNumber(a){
 const n=parseFloat(String(val(a,"price")).replace(/[^\d.]/g,"")); return isNaN(n)?0:n;
}

async function loadAccounts(){
 const box=document.getElementById("accounts");
 try{
  const snap=await getDocs(collection(db,"accounts"));
  allAccounts=snap.docs.map(d=>({id:d.id,...d.data()}));
  allAccounts.sort((a,b)=>{
   const at=a.createdAt?.toMillis?a.createdAt.toMillis():Number(a.createdAt||0);
   const bt=b.createdAt?.toMillis?b.createdAt.toMillis():Number(b.createdAt||0);
   return bt-at;
  });
  renderAccounts();
 }catch(e){
  console.error(e); box.innerHTML='<div class="empty">تعذر تحميل الحسابات حالياً.</div>';
 }
}

function renderAccounts(){
 let list=[...allAccounts];
 const q=document.getElementById("searchBox").value.trim().toLowerCase();
 if(q) list=list.filter(a=>JSON.stringify(a).toLowerCase().includes(q));

 if(currentFilter==="cheap") list=list.filter(a=>priceNumber(a)>0&&priceNumber(a)<=30);
 if(currentFilter==="strong") list=list.filter(a=>Number(val(a,"level","lvl"))>=60);
 if(currentFilter==="featured") list=list.filter(a=>a.featured===true||a.featured==="true"||a.featured==="yes");

 const box=document.getElementById("accounts");
 if(!list.length){box.innerHTML='<div class="empty">لا توجد حسابات مطابقة حالياً.</div>';return}
 box.innerHTML="";
 list.forEach((a,i)=>{
  const img=imageOf(a);
  const num=val(a,"accountNumber","number","accountNo","id");
  const level=val(a,"level","lvl");
  const rank=val(a,"rank","tier","rating");
  const outfits=val(a,"outfits","suits","clothes");
  const region=val(a,"region","area");
  const price=val(a,"price");
  const card=document.createElement("article");
  card.className="account";
  card.innerHTML=`
   <div class="account-head">
     <div class="account-title">حساب #${escapeHTML(num)}</div>
     <div class="crown">♛</div>
   </div>
   <div class="account-main">
    ${img
      ? `<img class="account-img" src="${escapeHTML(img)}" alt="صورة حساب PUBG">`
      : `<div class="account-img no-image">PUBG</div>`}
    <div class="meta">
     <div>◈ <b>المستوى:</b> <span class="value">${escapeHTML(level)}</span></div>
     <div>🏅 <b>الرتبة:</b> <span class="value">${escapeHTML(rank)}</span></div>
     <div>👕 <b>عدد الأزياء:</b> <span class="value">${escapeHTML(outfits)}</span></div>
     <div>🌐 <b>المنطقة:</b> <span class="value">${escapeHTML(region)}</span></div>
    </div>
   </div>
   <div class="account-bottom">
     <div class="price">${escapeHTML(price)} د.ل</div>
     <button class="details">تفاصيل الحساب 👁</button>
   </div>`;
  card.querySelector(".details").onclick=()=>openDetails(a,i);
  if(img) card.querySelector(".account-img").onclick=()=>window.open(img,"_blank");
  box.appendChild(card);
 });
}

window.openDetails=function(a){
 const img=imageOf(a);
 const num=val(a,"accountNumber","number","accountNo","id");
 const price=val(a,"price");
 const fields=[
  ["المستوى",val(a,"level","lvl")],["الرتبة",val(a,"rank","tier","rating")],
  ["عدد الميثك",val(a,"mythic")],["الميثك الذهبي",val(a,"golden")],
  ["لفل القوة",val(a,"power")],["أسلحة التطوير",val(a,"weapons")],
  ["السيارات",val(a,"cars")],["البدلات",val(a,"suits","outfits","clothes")],
  ["الهاشتاقات",val(a,"hashtags")],["الرفقاء",val(a,"friends")],
  ["الشعبية",val(a,"popularity")],["الربط",val(a,"binding")],
  ["المنطقة",val(a,"region","area")],["صاحب الحساب",val(a,"owner")]
 ];
 document.getElementById("modalTitle").textContent=`تفاصيل الحساب #${num}`;
 document.getElementById("modalBody").innerHTML=
  (img?`<img class="modal-img" src="${escapeHTML(img)}" alt="حساب PUBG">`:"")+
  `<div class="detail-grid">${fields.map(x=>`<div class="detail-item"><b>${escapeHTML(x[0])}:</b> ${escapeHTML(x[1])}</div>`).join("")}</div>`+
  `<div class="detail-item" style="margin-top:8px;text-align:center;font-size:18px;color:#ffd13a"><b>السعر:</b> ${escapeHTML(price)} د.ل</div>`+
  `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/218928773294?text=${encodeURIComponent("السلام عليكم، أريد الاستفسار عن حساب PUBG رقم #"+num+" بسعر "+price+" د.ل.")}">📲 استفسار عن الحساب عبر واتساب</a>`;
 document.getElementById("modal").classList.add("show");
};
window.closeModal=function(){document.getElementById("modal").classList.remove("show")};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.getElementById("searchBox").addEventListener("input",renderAccounts);
document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active"); currentFilter=btn.dataset.filter; renderAccounts();
});
loadAccounts();
</script>
</body>
