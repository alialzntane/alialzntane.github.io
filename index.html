<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALI ALZNTANE | PUBG</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;color:#fff;background:#07090d}
.card{width:min(92vw,430px);padding:30px 20px;margin:auto;text-align:center;border-radius:28px;background:#0c0f15;border:1px solid #252d39}
.logo{width:155px;height:155px;margin:auto auto 18px;border-radius:30px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:29px}
p{color:#9ca7b5}
.social{display:block;text-decoration:none;color:#fff;padding:14px;margin:12px 0;border-radius:17px;background:#151a22;border:1px solid #29313d;font-weight:bold}
.pubg-section{margin-top:30px;padding-top:25px;border-top:1px solid #252d39}
.pubg-title{font-size:22px;font-weight:bold;margin-bottom:15px}
.search-box{width:100%;padding:13px;border-radius:14px;border:1px solid #303b4b;background:#080c12;color:#fff;margin-bottom:15px}
.account{background:#10151d;border:1px solid #29313d;border-radius:20px;padding:15px;margin-top:18px;text-align:right}
.account h2{text-align:center}
.account-images{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.account-images img{width:100%;height:140px;object-fit:cover;border-radius:12px}
.info{background:#151b24;border-radius:13px;padding:10px;margin:7px 0}
.status{text-align:center;padding:20px;color:#aaa}
</style>
</head>

<body>

<main class="card">

<div class="logo">
<img src="file_00000000323c8210a4643f0333bc8a0a.png">
</div>

<h1>ALI ALZNTANE</h1>
<p>PUBG ACCOUNTS • GAMING</p>

<a class="social" href="https://www.tiktok.com/@5c.se" target="_blank">تيك توك</a>
<a class="social" href="https://wa.me/218928773294" target="_blank">واتساب</a>
<a class="social" href="https://t.me/ali_alzntane" target="_blank">تيليجرام</a>

<section class="pubg-section">

<div class="pubg-title">🎮 حسابات ببجي موبايل العالمية</div>

<input id="searchBox" class="search-box" placeholder="🔎 ابحث عن صاحب الحساب...">

<div id="accounts">
<div class="status">جاري تحميل الحسابات...</div>
</div>

</section>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyD1W0255eoUqKur7PohKhm_Z83oj43wTVI",
authDomain:"ali-pubg-4418e.firebaseapp.com",
projectId:"ali-pubg-4418",
storageBucket:"ali-pubg-4418.firebasestorage.app",
messagingSenderId:"859531411276",
appId:"1:859531411276:web:445f957d53c22ca4bb59e9"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let allAccounts=[];

function esc(value){
return String(value ?? "")
.replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]));
}

function renderAccounts(list){

const box=document.getElementById("accounts");

if(!list.length){
box.innerHTML='<div class="status">لا توجد حسابات مضافة حالياً.</div>';
return;
}

box.innerHTML=list.map(account=>{

let images="";

if(Array.isArray(account.images)){

const urls=account.images.map(image=>{

if(typeof image==="string") return image;

return image?.url || "";

}).filter(Boolean);

if(urls.length){

images=`
<div class="account-images">
${urls.map(url=>`
<img src="${esc(url)}" loading="lazy">
`).join("")}
</div>
`;

}
}

return `
<div class="account">

<h2>🎮 ${esc(account.owner || "حساب PUBG")}</h2>

${images}

<div class="info">🏆 <b>لفل:</b> ${esc(account.level || "-")}</div>

<div class="info">
💎 <b>الميثك:</b> ${esc(account.mythic || "-")}
&nbsp; | &nbsp;
💪 <b>لفل القوة:</b> ${esc(account.power || "-")}
</div>

<div class="info">🟡 <b>الميثك الذهبي:</b> ${esc(account.golden || "-")}</div>

<div class="info">🔫 <b>أسلحة التطوير:</b> ${esc(account.weapons || "-")}</div>

<div class="info">🚗 <b>السيارات:</b> ${esc(account.cars || "-")}</div>

<div class="info">👕 <b>بدلات X:</b> ${esc(account.suits || "-")}</div>

<div class="info">#️⃣ <b>هاشتاقات:</b> ${esc(account.hashtags || "-")}</div>

<div class="info">👥 <b>الرفقاء:</b> ${esc(account.friends || "-")}</div>

<div class="info">📈 <b>الشعبية:</b> ${esc(account.popularity || "-")}</div>

<div class="info">🔗 <b>الربط:</b> ${esc(account.binding || "-")}</div>

<div class="info">💰 <b>السعر:</b> ${esc(account.price || "-")}</div>

</div>
`;

}).join("");

}

onSnapshot(
collection(db,"accounts"),
snapshot=>{

allAccounts=snapshot.docs.map(doc=>({
id:doc.id,
...doc.data()
}));

renderAccounts(allAccounts);

},
error=>{

console.error("Firebase error:",error);

document.getElementById("accounts").innerHTML=
'<div class="status">⚠️ تعذر الاتصال بقاعدة البيانات.</div>';

}
);

document.getElementById("searchBox").addEventListener("input",function(){

const text=this.value.trim().toLowerCase();

if(!text){
renderAccounts(allAccounts);
return;
}

renderAccounts(
allAccounts.filter(account=>
JSON.stringify(account).toLowerCase().includes(text)
)
);

});

</script>

</body>
</html>
