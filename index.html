<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyD1W0255eoUqKur7PohKhm_Z83oj43wTVI",

authDomain:
"ali-pubg-4418e.firebaseapp.com",

projectId:
"ali-pubg-4418",

storageBucket:
"ali-pubg-4418.firebasestorage.app",

messagingSenderId:
"859531411276",

appId:
"1:859531411276:web:445f957d53c22ca4bb59e9"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);


let allAccounts=[];


/* حماية النص */

function escapeHTML(value){

const div=
document.createElement("div");

div.textContent=
value ?? "";

return div.innerHTML;

}


/* تحميل الحسابات */

async function loadAccounts(){

const container=
document.getElementById("accounts");

container.innerHTML=
'<div class="loading">جاري تحميل الحسابات...</div>';

try{

/*
قراءة الحسابات من مجموعة accounts
*/

const snapshot=
await getDocs(
collection(db,"الحسابات")
);


allAccounts=
snapshot.docs.map(doc=>({

id:doc.id,
...doc.data()

}));


/* ترتيب الأحدث أولاً */

allAccounts.sort((a,b)=>{

const aTime=
a.createdAt?.toMillis
?
a.createdAt.toMillis()
:
Number(a.createdAt||0);

const bTime=
b.createdAt?.toMillis
?
b.createdAt.toMillis()
:
Number(b.createdAt||0);

return bTime-aTime;

});


renderAccounts(allAccounts);


}catch(error){

console.error(error);

container.innerHTML=
'<div class="empty">تعذر تحميل الحسابات حالياً.</div>';

}

}


/* عرض الحسابات */

function renderAccounts(accounts){

const container=
document.getElementById("accounts");


if(!accounts.length){

container.innerHTML=
'<div class="empty">لا توجد حسابات مضافة حالياً.</div>';

return;

}


container.innerHTML="";


accounts.forEach(account=>{

const card=
document.createElement("div");

card.className="account";


let imagesHTML="";


if(
Array.isArray(account.images)
&&
account.images.length
){

const images=
account.images
.map(image=>{

/* دعم الصور القديمة والجديدة */

if(
typeof image==="string"
){

return image;

}

return image?.url||"";

})
.filter(Boolean);


if(images.length){

imagesHTML=`

<div class="account-images">

${images.map(url=>`

<img
src="${escapeHTML(url)}"
alt="صورة حساب PUBG"
loading="lazy"
data-image="${escapeHTML(url)}"
>

`).join("")}

</div>

`;

}

}


card.innerHTML=`

<h2>
🎮 ببجي موبايل العالمية ✅
</h2>

${imagesHTML}

<div class="info">
🏆 <b>لفل:</b>
${escapeHTML(account.level||"-")}
</div>

<div class="info">
💎 <b>عدد الميثك:</b>
${escapeHTML(account.mythic||"-")}
&nbsp;&nbsp; | &nbsp;&nbsp;
💪 <b>لفل القوة:</b>
${escapeHTML(account.power||"-")}
</div>

<div class="info">
🟡 <b>الميثك الذهبي:</b>
${escapeHTML(account.golden||"-")}
</div>

<div class="info">
🔫 <b>أسلحة التطوير:</b>
${escapeHTML(account.weapons||"-")}
</div>

<div class="info">
🚗 <b>السيارات:</b>
${escapeHTML(account.cars||"-")}
</div>

<div class="info">
👕 <b>بدلات X:</b>
${escapeHTML(account.suits||"-")}
</div>

<div class="info">
#️⃣ <b>هاشتاقات:</b>
${escapeHTML(account.hashtags||"-")}
</div>

<div class="info">
👥 <b>الرفقاء:</b>
${escapeHTML(account.friends||"-")}
</div>

<div class="info">
📈 <b>مستوى الشعبية:</b>
${escapeHTML(account.popularity||"-")}
</div>

<div class="info">
🔗 <b>الربط:</b>
${escapeHTML(account.binding||"-")}
</div>

<div class="info">
💰 <b>السعر:</b>
${escapeHTML(account.price||"-")}
</div>

<div class="info">
👤 <b>صاحب الحساب:</b>
${escapeHTML(account.owner||"-")}
</div>

`;


container.appendChild(card);

});


/* فتح الصور */

container
.querySelectorAll("[data-image]")
.forEach(image=>{

image.onclick=()=>{

window.open(
image.dataset.image,
"_blank"
);

};

});

}


/* البحث */

document
.getElementById("searchBox")
.addEventListener(
"input",
function(){

const text=
this.value
.trim()
.toLowerCase();


if(!text){

renderAccounts(allAccounts);

return;

}


const filtered=
allAccounts.filter(account=>

JSON.stringify(account)
.toLowerCase()
.includes(text)

);


renderAccounts(filtered);

});


/* تشغيل */

loadAccounts();

</script>
