<div class="modal" id="modal">

<div class="modal-box">

<h2>➕ إضافة حساب PUBG</h2>

<div class="input-group">
<label>اسم الحساب / صاحب الحساب</label>
<input id="owner" placeholder="مثال: محمد">
</div>

<div class="input-group">
<label>الرفقاء</label>
<input id="friends" placeholder="مثال: 3 رفقاء">
</div>

<div class="input-group">
<label>السعر</label>
<input id="price" placeholder="مثال: 500 د.ل">
</div>

<div class="input-group">
<label>اللفل</label>
<input id="level" placeholder="مثال: 75">
</div>

<div class="input-group">
<label>عدد الميثك</label>
<input id="mythic" placeholder="مثال: 12">
</div>

<div class="input-group">
<label>لفل القوة</label>
<input id="power" placeholder="مثال: 60">
</div>

</div>

<input id="weapons" placeholder="مثال: M416 - AKM - UMP">
</div>

<div class="input-group">
<label>السيارات</label>
<input id="cars" placeholder="اكتب السيارات">
</div>

<div class="input-group">
<label>بدلات X</label>
<input id="suits" placeholder="اكتب البدلات">
</div>

<div class="input-group">
<label>هاشتاقات</label>
<input id="hashtags" placeholder="#PUBG #MYTHIC">
</div>

<div class="input-group">
<label>صور الحساب - حتى 10 صور</label>
<input id="images" type="file" accept="image/*" multiple>
<div class="image-note">
يمكن اختيار 10 صور كحد أقصى.
</div>
</div>

<button class="save-btn" onclick="saveAccount()">
💾 حفظ الحساب
</button>

<button class="close-btn" onclick="closeModal()">
إلغاء
</button>

</div>
</div>

<script>

let accounts = JSON.parse(localStorage.getItem("pubgAccounts") || "[]");

function openModal(){
document.getElementById("modal").style.display="block";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function saveAccount(){

const owner=document.getElementById("owner").value.trim();

if(!owner){
alert("اكتب اسم صاحب الحساب");
return;
}

const files=document.getElementById("images").files;

if(files.length>10){
alert("مسموح بحد أقصى 10 صور لكل حساب");
return;
}

const account={
id:Date.now(),
owner:owner,
friends:document.getElementById("friends").value,
price:document.getElementById("price").value,
level:document.getElementById("level").value,
mythic:document.getElementById("mythic").value,
power:document.getElementById("power").value,
golden:document.getElementById("golden").value,
weapons:document.getElementById("weapons").value,
cars:document.getElementById("cars").value,
suits:document.getElementById("suits").value,
hashtags:document.getElementById("hashtags").value,
images:[]
};

let remaining=files.length;

if(remaining===0){

accounts.push(account);
localStorage.setItem("pubgAccounts",JSON.stringify(accounts));
renderAccounts();
closeModal();
clearForm();
return;

}

Array.from(files).forEach(file=>{

const reader=new FileReader();

reader.onload=function(e){

account.images.push(e.target.result);
remaining--;

if(remaining===0){

accounts.push(account);

localStorage.setItem(
"pubgAccounts",
JSON.stringify(accounts)
);

renderAccounts();
closeModal();
clearForm();

}

};

reader.readAsDataURL(file);

});

}

function renderAccounts(){

const container=document.getElementById("accounts");

if(accounts.length===0){

container.innerHTML=
'<div class="empty">لا توجد حسابات مضافة حالياً</div>';

return;
}

container.innerHTML="";

accounts.forEach((account,index)=>{

let images="";

account.images.forEach(img=>{

images+=`
<img src="${img}" alt="صورة حساب PUBG">
`;

});

container.innerHTML+=`

<div class="account">

<h2>🎮 حساب ببجي #${index+1}</h2>

${images ? `<div class="account-images">${images}</div>` : ""}

<div class="info">
👤 <b>صاحب الحساب:</b> ${account.owner}
</div>

<div class="info">
👥 <b>الرفقاء:</b> ${account.friends || "-"}
</div>

<div class="info">
💰 <b>السعر:</b> ${account.price || "-"}
</div>

<div class="info">
🏆 <b>اللفل:</b> ${account.level || "-"}
</div>

<div class="info">
💎 <b>عدد الميثك:</b> ${account.mythic || "-"}
</div>

<div class="info">
💪 <b>لفل القوة:</b> ${account.power || "-"}
</div>

<div class="info">
🟡 <b>الميثك الذهبي:</b> ${account.golden || "-"}
</div>

<div class="info">
🔫 <b>أسلحة التطوير:</b> ${account.weapons || "-"}
</div>

<div class="info">
🚗 <b>السيارات:</b> ${account.cars || "-"}
</div>

<div class="info">
👕 <b>بدلات X:</b> ${account.suits || "-"}
</div>

<div class="info">
#️⃣ <b>هاشتاقات:</b> ${account.hashtags || "-"}
</div>

<button class="delete-btn" onclick="deleteAccount(${account.id})">
🗑️ حذف الحساب
</button>

</div>

`;

});

}

function deleteAccount(id){

if(!confirm("هل تريد حذف هذا الحساب؟")){
return;
}

accounts=accounts.filter(account=>account.id!==id);

localStorage.setItem(
"pubgAccounts",
JSON.stringify(accounts)
);

renderAccounts();

}

function clearForm(){

const fields=[
"owner",
"friends",
"price",
"level",
"mythic",
"power",
"golden",
"weapons",
"cars",
"suits",
"hashtags"
];

fields.forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("images").value="";

}

renderAccounts();

</script>
