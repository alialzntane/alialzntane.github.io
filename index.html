<style>
*{box-sizing:border-box}
:root{
 --bg:#02070d;--panel:#06111c;--panel2:#0a1724;--card:#0a1622;
 --line:#1b334b;--line2:#263e56;--gold:#f4c21b;--gold2:#ffd84a;
 --text:#f7f9fc;--muted:#9eacbd
}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:#02070d;color:var(--text);font-family:Arial,Tahoma,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:
 radial-gradient(circle at 50% 0,#12283c 0,transparent 34%),
 radial-gradient(circle at 10% 80%,#0a1724 0,transparent 35%),
 #02070d}
button,input{font:inherit}button{cursor:pointer}
.page{width:min(1240px,96vw);margin:0 auto;padding:14px 0 28px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.panel{min-width:0;border:1px solid #17304a;border-radius:26px;background:linear-gradient(180deg,#06111c,#030a12 80%);box-shadow:0 22px 70px #000a;overflow:hidden}
.panel-top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #1b3147;background:rgba(2,9,16,.9)}
.top-btn{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:32px;line-height:1}
.top-search{font-size:34px}
.logo-small{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #9d7810;box-shadow:0 0 20px #e2b50044}
.home{padding:26px 28px 30px;text-align:center}
.logo-big{width:188px;height:188px;border-radius:50%;object-fit:cover;border:2px solid #9d7810;box-shadow:0 0 34px #e2b50055;margin:0 auto 20px}
.brand{font-size:43px;font-weight:900;letter-spacing:1px;margin:0}
.tagline{font-size:18px;color:#aab7c9;margin:9px 0 28px;letter-spacing:.5px}
.socials{display:grid;gap:13px}
.social{height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;text-decoration:none;color:#fff;border:1px solid #1b344d;border-radius:20px;background:linear-gradient(100deg,#081421,#0a1a29);font-size:21px;font-weight:900;transition:.18s}
.social:hover{border-color:var(--gold);transform:translateY(-1px)}
.social .arrow{font-size:30px;color:#7c91a8}
.social-icon{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:30px;direction:ltr}
.tiktok{background:#071321}.whatsapp{background:#0a5c39}.telegram{background:#0b5c7d}.game{background:#152538}
.browse{margin-top:18px;height:78px;border:2px solid var(--gold);border-radius:20px;background:linear-gradient(100deg,#0a1724,#111c28);color:#fff;box-shadow:0 0 18px #e7b9002b;font-size:22px;font-weight:900}
.browse span{margin-left:8px}
.home-section{margin-top:42px;text-align:right}
.section-title{font-size:30px;font-weight:900;margin:0;padding:0 0 15px;border-bottom:2px solid var(--gold)}
.section-title .globe{color:var(--gold)}
.home-search{margin-top:20px}
.search{position:relative}
.search input{width:100%;height:58px;border-radius:18px;border:1px solid #28415b;background:#06111d;color:#fff;padding:0 54px 0 18px;outline:none;font-size:16px}
.search input::placeholder{color:#8f9eaf}
.search span{position:absolute;right:17px;top:11px;font-size:30px;color:#91a6bc}
.featured-card{position:relative;height:250px;margin-top:20px;border:1px solid #24415c;border-radius:21px;overflow:hidden;background:#081522;box-shadow:0 12px 30px #0007}
.featured-img{width:100%;height:100%;object-fit:cover;display:block}
.featured-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#02070df0 0%,#02070d30 55%,transparent 100%)}
.featured-overlay{position:absolute;z-index:2;inset:auto 20px 17px 20px;text-align:right}
.featured-title{font-size:22px;font-weight:900}.featured-text{color:#d3dbe5;font-size:14px;margin-top:5px}.featured-price{color:var(--gold2);font-size:27px;font-weight:900;margin-top:6px}
.catalog-body{padding:28px 25px 30px}
.catalog-title{font-size:31px;font-weight:900;margin:0 0 20px}
.catalog-title .globe{color:var(--gold)}
.filters{display:flex;gap:9px;overflow:auto;padding:2px 0 7px;margin:14px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid #1d3851;background:#06111d;color:#fff;border-radius:24px;padding:11px 18px;font-weight:800}
.filter.active{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 15px #e4b30028}
.accounts{display:grid;gap:16px}
.account{border:1px solid #1d3851;border-radius:21px;background:linear-gradient(135deg,#0b1825,#06111b);padding:17px;overflow:hidden}
.account:hover{border-color:#9a760c}
.account-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.account-title{font-size:21px;font-weight:900}.crown{color:var(--gold2);font-size:24px}
.account-main{display:grid;grid-template-columns:185px minmax(0,1fr);gap:15px;align-items:center}
.account-img{width:185px;height:180px;object-fit:cover;border-radius:16px;border:1px solid #3a5269;background:#08111a;display:block;cursor:pointer}
.account-img.no-image{display:grid;place-items:center;color:#9aaabd}
.meta{display:grid;gap:10px;min-width:0;color:#dce5ef;font-size:15px}
.meta div{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:#fff}.meta .value{color:#d9e2ec}
.account-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}
.price{font-size:28px;font-weight:900;color:var(--gold2)}
.details{min-width:205px;border:2px solid var(--gold);background:#0b1723;color:var(--gold2);border-radius:15px;padding:10px 15px;font-weight:900}
.details:hover{background:#1b1c13}
.empty,.loading{text-align:center;color:#8393a6;padding:35px}
footer{text-align:center;color:#657589;font-size:12px;padding-top:14px}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.show{display:flex}.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;border:1px solid #334a61;border-radius:24px;background:#07131f;padding:20px;box-shadow:0 30px 90px #000}
.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.close{border:0;background:#1a2735;color:#fff;border-radius:12px;width:42px;height:42px;font-size:23px}
.modal-img{width:100%;max-height:330px;object-fit:cover;border-radius:17px;margin:15px 0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail-item{background:#101e2b;border-radius:12px;padding:10px;font-size:14px}
.wa{display:block;text-align:center;text-decoration:none;margin-top:15px;background:#16864d;color:#fff;padding:14px;border-radius:14px;font-weight:900}
@media(max-width:900px){
 .page{width:min(700px,100%);padding:0 8px 25px}
 .panels{grid-template-columns:1fr;gap:14px}
 .panel{border-radius:22px}
 .home{padding:24px 18px 25px}
 .logo-big{width:165px;height:165px}
 .brand{font-size:34px}
 .catalog-body{padding:23px 18px 25px}
}
@media(max-width:520px){
 .page{padding:0 0 22px}
 .panel{border-radius:0 0 22px 22px}
 .panel-top{height:70px;padding:0 17px}
 .logo-small{width:58px;height:58px}
 .home{padding:22px 17px 25px}
 .logo-big{width:155px;height:155px}
 .brand{font-size:30px}
 .tagline{font-size:16px;margin-bottom:22px}
 .social{height:70px;font-size:19px;padding:8px 16px}
 .social-icon{width:50px;height:50px}
 .browse{height:68px;font-size:19px}
 .home-section{margin-top:34px}
 .section-title{font-size:25px}
 .featured-card{height:225px}
 .catalog-body{padding:22px 14px}
 .catalog-title{font-size:25px}
 .account{padding:15px}
 .account-main{grid-template-columns:125px minmax(0,1fr);gap:12px}
 .account-img{width:125px;height:125px}
 .account-title{font-size:19px}
 .meta{font-size:12.5px;gap:8px}
 .details{min-width:0;padding:10px 11px;font-size:12.5px}
 .price{font-size:24px}
 .detail-grid{grid-template-columns:1fr}
}
</style>
</head>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyD1W0255eoUqKur7PohKhm_Z83oj43wTVI",
 authDomain:"ali-pubg-4418e.firebaseapp.com",
 projectId:"ali-pubg-4418",
 storageBucket:"ali-pubg-4418.firebasestorage.app",
 messagingSenderId:"859531411276",
 appId:"1:859531411276:web:445f957d53c22ca4bb59e9"
};
const db=getFirestore(initializeApp(firebaseConfig));
let allAccounts=[];
let currentFilter="all";

function escapeHTML(value){
 const div=document.createElement("div"); div.textContent=value ?? ""; return div.innerHTML;
}
function val(a,...keys){
 for(const k of keys) if(a[k]!==undefined && a[k]!==null && a[k]!=="") return a[k];
 return "-";
}
function imageOf(a){
 if(Array.isArray(a.images)&&a.images.length){
  const x=a.images[0]; return typeof x==="string"?x:(x?.url||"");
 }
 return a.image||a.photo||"";
}
function priceNumber(a){
 const n=parseFloat(String(val(a,"price")).replace(/[^\d.]/g,"")); return isNaN(n)?0:n;
}

async function loadAccounts(){
 const box=document.getElementById("accounts");
 try{
  const snap=await getDocs(collection(db,"accounts"));
  allAccounts=snap.docs.map(d=>({id:d.id,...d.data()}));
  allAccounts.sort((a,b)=>{
   const at=a.createdAt?.toMillis?a.createdAt.toMillis():Number(a.createdAt||0);
   const bt=b.createdAt?.toMillis?b.createdAt.toMillis():Number(b.createdAt||0);
   return bt-at;
  });
  renderAccounts();
 }catch(e){
  console.error(e); box.innerHTML='<div class="empty">تعذر تحميل الحسابات حالياً.</div>';
 }
}

function renderFeatured(){
 const box=document.getElementById("featured");
 if(!box) return;
 if(!allAccounts.length){box.innerHTML="";return}
 const a=allAccounts[0];
 const img=imageOf(a);
 const num=val(a,"accountNumber","number","accountNo") || (allAccounts.indexOf(a)+1);
 const level=val(a,"level","lvl");
 const rank=val(a,"rank","tier","rating");
 const outfits=val(a,"outfits","suits","clothes");
 const region=val(a,"region","area");
 const price=val(a,"price");
 box.innerHTML=`<article class="featured-card">
   د.ل{img?`<img class="featured-img" src="د.ل{escapeHTML(img)}" alt="حساب PUBG">`:""}
   <div class="featured-overlay">
    <div class="featured-title">حساب #د.ل{escapeHTML(num)} 👑</div>
    <div class="featured-text">المستوى د.ل{escapeHTML(level)} • د.ل{escapeHTML(rank)} • د.ل{escapeHTML(outfits)} زي</div>
    <div class="featured-price">د.ل{escapeHTML(price)} د.ل</div>
   </div>
 </article>`;
}
function renderAccounts(){
 renderFeatured();
 let list=[...allAccounts];
 const q=document.getElementById("searchBox").value.trim().toLowerCase();
 if(q) list=list.filter(a=>JSON.stringify(a).toLowerCase().includes(q));

 if(currentFilter==="cheap") list=list.filter(a=>priceNumber(a)>0&&priceNumber(a)<=30);
 if(currentFilter==="strong") list=list.filter(a=>Number(val(a,"level","lvl"))>=60);
 if(currentFilter==="featured") list=list.filter(a=>a.featured===true||a.featured==="true"||a.featured==="yes");

 const box=document.getElementById("accounts");
 if(!list.length){box.innerHTML='<div class="empty">لا توجد حسابات مطابقة حالياً.</div>';return}
 box.innerHTML="";
 list.forEach((a,i)=>{
  const img=imageOf(a);
  const num=val(a,"accountNumber","number","accountNo") || (i+1);
  const level=val(a,"level","lvl");
  const rank=val(a,"rank","tier","rating");
  const outfits=val(a,"outfits","suits","clothes");
  const region=val(a,"region","area");
  const price=val(a,"price");
  const card=document.createElement("article");
  card.className="account";
  card.innerHTML=`
   <div class="account-head">
     <div class="account-title">حساب #د.ل{escapeHTML(num)}</div>
     <div class="crown">♛</div>
   </div>
   <div class="account-main">
    د.ل{img
      ? `<img class="account-img" src="د.ل{escapeHTML(img)}" alt="صورة حساب PUBG">`
      : `<div class="account-img no-image">PUBG</div>`}
    <div class="meta">
     <div>◈ <b>المستوى:</b> <span class="value">د.ل{escapeHTML(level)}</span></div>
     <div>🏅 <b>الرتبة:</b> <span class="value">د.ل{escapeHTML(rank)}</span></div>
     <div>👕 <b>عدد الأزياء:</b> <span class="value">د.ل{escapeHTML(outfits)}</span></div>
     <div>🌐 <b>المنطقة:</b> <span class="value">د.ل{escapeHTML(region)}</span></div>
    </div>
   </div>
   <div class="account-bottom">
     <div class="price">د.ل{escapeHTML(price)} د.ل</div>
     <button class="details">تفاصيل الحساب 👁</button>
   </div>`;
  card.querySelector(".details").onclick=()=>openDetails(a,i);
  if(img) card.querySelector(".account-img").onclick=()=>window.open(img,"_blank");
  box.appendChild(card);
 });
}

window.openDetails=function(a){
 const img=imageOf(a);
 const num=val(a,"accountNumber","number","accountNo","id");
 const price=val(a,"price");
 const fields=[
  ["المستوى",val(a,"level","lvl")],["الرتبة",val(a,"rank","tier","rating")],
  ["عدد الميثك",val(a,"mythic")],["الميثك الذهبي",val(a,"golden")],
  ["لفل القوة",val(a,"power")],["أسلحة التطوير",val(a,"weapons")],
  ["السيارات",val(a,"cars")],["البدلات",val(a,"suits","outfits","clothes")],
  ["الهاشتاقات",val(a,"hashtags")],["الرفقاء",val(a,"friends")],
  ["الشعبية",val(a,"popularity")],["الربط",val(a,"binding")],
  ["المنطقة",val(a,"region","area")],["صاحب الحساب",val(a,"owner")]
 ];
 document.getElementById("modalTitle").textContent=`تفاصيل الحساب #د.ل{num}`;
 document.getElementById("modalBody").innerHTML=
  (img?`<img class="modal-img" src="د.ل{escapeHTML(img)}" alt="حساب PUBG">`:"")+
  `<div class="detail-grid">د.ل{fields.map(x=>`<div class="detail-item"><b>د.ل{escapeHTML(x[0])}:</b> د.ل{escapeHTML(x[1])}</div>`).join("")}</div>`+
  `<div class="detail-item" style="margin-top:8px;text-align:center;font-size:18px;color:#ffd13a"><b>السعر:</b> د.ل{escapeHTML(price)} د.ل</div>`+
  `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/218928773294?text=د.ل{encodeURIComponent("السلام عليكم، أريد الاستفسار عن حساب PUBG رقم #"+num+" بسعر "+price+" د.ل.")}">📲 استفسار عن الحساب عبر واتساب</a>`;
 document.getElementById("modal").classList.add("show");
};
window.closeModal=function(){document.getElementById("modal").classList.remove("show")};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.getElementById("searchBox").addEventListener("input",renderAccounts);
document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active"); currentFilter=btn.dataset.filter; renderAccounts();
});
loadAccounts();
</script>
</body>
