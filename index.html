.container{

}

/* ================= HEADER ================= */

.hero{
  position:relative;
  overflow:hidden;
  padding:28px 18px 24px;
  text-align:center;
  border:1px solid #263544;
  border-radius:28px;
  background:
    linear-gradient(145deg,rgba(20,30,41,.97),rgba(8,12,17,.97));
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.hero:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  top:-100px;
  left:-70px;

}

.logo{

}

.hero-line{

}

/* ================= SOCIAL ================= */

.socials{

}

.socials a:hover{

/* ================= MAIN BUTTON ================= */

.accounts-btn{

  box-shadow:0 12px 30px rgba(0,0,0,.3);

}

.accounts-btn:hover{

}

/* ================= SECTION ================= */

.pubg-section{

  border:1px solid #202d3a;
  background:rgba(10,15,21,.94);

}

.section-head{
  display:flex;

  justify-content:space-between;
  gap:10px;
  margin:4px 3px 15px;
}

.section-title{

.section-badge{

  color:#aab7c4;
  background:#111923;
  border:1px solid #23303d;
  font-size:12px;
}

/* ================= SEARCH ================= */

.search-wrap{
  position:relative;
  margin-bottom:17px;
}

.search{
  width:100%;
  height:52px;
  padding:0 17px;
  outline:none;
  border-radius:16px;
  border:1px solid #253442;
  background:#0c131b;
  color:#fff;
  font-size:16px;
  transition:.2s;
}

.search:focus{
  border-color:#52687a;
  box-shadow:0 0 0 3px rgba(100,130,150,.08);
}

.search::placeholder{
  color:#667585;
}

/* ================= ACCOUNT ================= */

.account{
  position:relative;
  overflow:hidden;
  margin-bottom:20px;
  padding:12px;
  border-radius:24px;
  border:1px solid #283746;
  background:
    linear-gradient(145deg,#121b25,#0a1017);
  box-shadow:
    0 18px 45px rgba(0,0,0,.4),

}

.account:before{
  content:"";
  display:block;
  width:100%;
  height:3px;
  margin-bottom:12px;
  border-radius:20px;
  background:linear-gradient(90deg,#263746,#8192a1,#263746);
}

/* ================= ACCOUNT NUMBER ================= */

.account-number{
  display:inline-block;

  padding:7px 11px;

  color:#c7d0d9;
  background:#101923;
  border:1px solid #273542;
  font-size:13px;
  font-weight:900;
}

/* ================= IMAGES ================= */

.account-images{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;

}

.account-images img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:18px;
  border:1px solid #2b3947;
  background:#05080b;
  transition:.25s;
}

.account-images img:hover{
  transform:scale(1.015);
  border-color:#566a7b;
}

/* ================= INFO GRID ================= */

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:8px;
}

.info{
  min-height:58px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:11px;
  border-radius:14px;
  background:#101821;
  border:1px solid #1e2a36;
  color:#c8d1da;
  font-size:13px;
  line-height:1.5;
}

.info b{
  color:#fff;
}

/* ================= PRICE ================= */

.price-box{
  position:relative;
  overflow:hidden;
  margin:13px 0 9px;
  padding:18px 12px;
  text-align:center;
  border-radius:18px;
  background:
    linear-gradient(135deg,#19232e,#0e151d);
  border:1px solid #435364;
  box-shadow:inset 0 0 25px rgba(255,255,255,.025);
}

.price-label{
  display:block;
  margin-bottom:5px;
  color:#8796a5;
  font-size:12px;
}

.price-value{
  font-size:26px;
  font-weight:1000;
}

/* ================= OWNER ================= */

.owner-box{
  margin-top:8px;
  padding:13px;
  text-align:center;
  border-radius:15px;
  background:#0e161f;
  border:1px solid #202d39;
  color:#c5ced7;
  font-size:14px;
}

/* ================= CONTACT ================= */

.contact-btn{
  display:block;
  margin-top:11px;
  padding:16px 10px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  border-radius:16px;
  background:linear-gradient(135deg,#176447,#0d4935);
  border:1px solid #298663;
  font-size:18px;
  font-weight:1000;
  box-shadow:0 9px 24px rgba(0,0,0,.3);
  transition:.2s;
}

.contact-btn:hover{
  transform:translateY(-2px);

/* ================= NAME ================= */

.card-site-name{
  margin-top:11px;
  padding:12px;
  text-align:center;
  border-radius:14px;
  background:#0d141c;
  border:1px solid #263442;
  color:#dce3e9;
  font-size:15px;
  font-weight:900;
  letter-spacing:1.5px;
}

/* ================= LOADING ================= */

.loading,

.footer{

/* ================= MOBILE ================= */

}

@media(max-width:360px){

  .info-grid{
    grid-template-columns:1fr;
  }

  .account-images{
    gap:6px;
  }
}

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:"AIzaSyD1W0255eoUqKur7PohKhm_Z83oj43wTVI",

  authDomain:"ali-pubg-4418e.firebaseapp.com",

  projectId:"ali-pubg-4418",

  storageBucket:"ali-pubg-4418e.firebasestorage.app",

  messagingSenderId:"859531411276",

  appId:"1:859531411276:web:445f957d53c22ca4bb59e9"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const accountsBox =
  document.getElementById("accounts");

const searchInput =
  document.getElementById("search");


let allAccounts = [];


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD
========================= */

async function loadAccounts(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"accounts")
      );


    allAccounts = [];


    snapshot.forEach(doc=>{

      allAccounts.push({

        id:doc.id,

        ...doc.data()

      });

    });


    /* الأحدث أولاً */

    allAccounts.sort((a,b)=>{

      const aTime =
        a.createdAt?.seconds ||
        a.createdAt?.toMillis?.() ||
        0;

      const bTime =
        b.createdAt?.seconds ||
        b.createdAt?.toMillis?.() ||
        0;

      return bTime-aTime;

    });


    renderAccounts(allAccounts);


  }catch(error){

    console.error(error);

    accountsBox.innerHTML = `

      <div class="no-results">

        ❌ حدث خطأ أثناء تحميل الحسابات

      </div>

    `;

  }

}


/* =========================
   RENDER
========================= */

function renderAccounts(accounts){

  if(!accounts.length){

    accountsBox.innerHTML = `

      <div class="no-results">

        لا توجد حسابات حالياً

      </div>

    `;

    return;
  }


  accountsBox.innerHTML =

    accounts.map((account,index)=>{


      const accountNumber =
        index+1;


      const price =
        account.price || "-";


      const message =
        `السلام عليكم أريد الاستفسار عن حساب رقم ${accountNumber} وسعره ${price} وسيط عشاري`;


      const whatsappLink =
        `https://wa.me/218928773294?text=${encodeURIComponent(message)}`;


      /* الصور */

      let images=[];


      if(Array.isArray(account.images)){

        images =
          account.images
            .filter(Boolean)
            .slice(0,10);

      }else if(account.image){

        images=[account.image];

      }


      const imagesHTML =

        images.length

        ? `

          <div class="account-images">

            ${images.map(src=>`

              <img

                src="${escapeHTML(src)}"

                alt="صورة حساب PUBG"

                loading="lazy"

              >

            `).join("")}

          </div>

        `

        : "";


      return `

        <article class="account">


          <div class="account-number">

            🎮 حساب PUBG #${accountNumber}

          </div>


          ${imagesHTML}


          <div class="info-grid">


            <div class="info">

              🏆

              <span>

                <b>لفل:</b>

                ${escapeHTML(account.level||"-")}

              </span>

            </div>


            <div class="info">

              💎

              <span>

                <b>الميثك:</b>

                ${escapeHTML(account.mythicCount||"-")}

              </span>

            </div>


            <div class="info">

              💪

              <span>

                <b>القوة:</b>

                ${escapeHTML(account.power||"-")}

              </span>

            </div>


            <div class="info">

              🟡

              <span>

                <b>الميثك الذهبي:</b>

                ${escapeHTML(account.goldenMythic||"-")}

              </span>

            </div>


            <div class="info">

              🔫

              <span>

                <b>أسلحة التطوير:</b>

                ${escapeHTML(account.upgradeWeapons||"-")}

              </span>

            </div>


            <div class="info">

              🚘

              <span>

                <b>السيارات:</b>

                ${escapeHTML(account.cars||"-")}

              </span>

            </div>


            <div class="info">

              👕 

              <span>

                <b>بدلات X:</b>

                ${escapeHTML(account.xSuits||"-")}

              </span>

            </div>


            <div class="info">

              #️⃣

              <span>

                <b>الهاشتاقات:</b>

                ${escapeHTML(account.hashtags||"-")}

              </span>

            </div>


            <div class="info">

              👥

              <span>

                <b>الرفقاء:</b>

                ${escapeHTML(account.friends||"-")}

              </span>

            </div>


            <div class="info">

              📈

              <span>

                <b>الشعبية:</b>

                ${escapeHTML(account.popularity||"-")}

              </span>

            </div>


            <div class="info">

              🔗

              <span>

                <b>الربط:</b>

                ${escapeHTML(account.binding||"-")}

              </span>

            </div>


          </div>


          <div class="price-box">

            <span class="price-label">

              💰 سعر الحساب

            </span>

            <div class="price-value">

              ${escapeHTML(price)}

            </div>

          </div>


          <div class="owner-box">

            👤 صاحب الحساب:

            <b>

              ${escapeHTML(account.owner||"-")}

            </b>

          </div>


          <a

            class="contact-btn"

            href="${whatsappLink}"

            target="_blank"

            rel="noopener"

          >

            📲 استفسار عن الحساب

          </a>


          <div class="card-site-name">

            ALI ALZNTANE

          </div>


        </article>

      `;

    }).join("");

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
  "input",
  ()=>{

    const text =
      searchInput.value
        .trim()
        .toLowerCase();


    if(!text){

      renderAccounts(allAccounts);

      return;

    }


    const filtered =
      allAccounts.filter(account=>{

        const data = [

          account.owner,
          account.level,
          account.price,
          account.mythicCount,
          account.power,
          account.goldenMythic,
          account.upgradeWeapons,
          account.cars,
          account.xSuits,
          account.hashtags,
          account.friends,
          account.popularity,
          account.binding

        ]
        .join(" ")
        .toLowerCase();


        return data.includes(text);

      });


    renderAccounts(filtered);

  }
);


/* =========================
   START
========================= */

loadAccounts();

</script>
