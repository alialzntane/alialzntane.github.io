<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyD1W0255eoUqKur7PohKhm_Z83oj43wTVI",
authDomain:"ali-pubg-4418e.firebaseapp.com",
projectId:"ali-pubg-4418",
storageBucket:"ali-pubg-4418e.firebasestorage.app",
messagingSenderId:"859531411276",
appId:"1:859531411276:web:445f957d53c22ca4bb59e9"
};


const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const accountsBox=
document.getElementById("accounts");

const searchInput=
document.getElementById("search");

let allAccounts=[];


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function loadAccounts(){

try{

const snapshot=
await getDocs(
collection(db,"accounts")
);

allAccounts=[];

snapshot.forEach(doc=>{

allAccounts.push({
id:doc.id,
...doc.data()
});

});


allAccounts.sort((a,b)=>{

const aTime=
a.createdAt?.seconds || 0;

const bTime=
b.createdAt?.seconds || 0;

return bTime-aTime;

});


renderAccounts(allAccounts);

}catch(error){

console.error(error);

accountsBox.innerHTML=`

<div class="no-results">
❌ حدث خطأ أثناء تحميل الحسابات
</div>

`;

}

}


function renderAccounts(accounts){

if(!accounts.length){

accountsBox.innerHTML=`

<div class="no-results">
لا توجد حسابات حالياً
</div>

`;

return;

}


accountsBox.innerHTML=
accounts.map((account,index)=>{

const accountNumber=index+1;

const price=
account.price || "-";


const message=
`السلام عليكم أريد الاستفسار عن حساب رقم ${accountNumber} وسعره ${price} وسيط عشاري`;


const whatsappLink=
`https://wa.me/218928773294?text=${encodeURIComponent(message)}`;


let images=[];

if(Array.isArray(account.images)){

images=
account.images
.filter(Boolean)
.slice(0,10);

}else if(account.image){

images=[account.image];

}


const imagesHTML=
images.length
?`

<div class="account-images">

${images.map(src=>`

<img
src="${escapeHTML(src)}"
alt="صورة حساب PUBG"
loading="lazy"
>

`).join("")}

</div>

`
:"";


return`

<article class="account">

${imagesHTML}


<div class="info">
🏆 <b>لفل:</b>
${escapeHTML(account.level||"-")}
</div>


<div class="info">
💎 <b>عدد الميثك:</b>
${escapeHTML(account.mythicCount||"-")}
&nbsp;&nbsp; | &nbsp;&nbsp;
💪 <b>لفل القوة:</b>
${escapeHTML(account.power||"-")}
</div>


<div class="info">
🟡 <b>الميثك الذهبي:</b>
${escapeHTML(account.goldenMythic||"-")}
</div>


<div class="info">
🔫 <b>أسلحة التطوير:</b>
${escapeHTML(account.upgradeWeapons||"-")}
</div>


<div class="info">
🚘 <b>السيارات:</b>
${escapeHTML(account.cars||"-")}
</div>


<div class="info">
👕 <b>بدلات X:</b>
${escapeHTML(account.xSuits||"-")}
</div>


<div class="info">
#️⃣ <b>هاشتاقات:</b>
${escapeHTML(account.hashtags||"-")}
</div>


<div class="info">
👥 <b>الرفقاء:</b>
${escapeHTML(account.friends||"-")}
</div>


<div class="info">
📈 <b>مستوى الشعبية:</b>
${escapeHTML(account.popularity||"-")}
</div>


<div class="info">
🔗 <b>الربط:</b>
${escapeHTML(account.binding||"-")}
</div>


<div class="price-box">
💰 السعر:
${escapeHTML(account.price||"-")}
</div>


<div class="info">
👤 <b>صاحب الحساب:</b>
${escapeHTML(account.owner||"-")}
</div>


<a
class="contact-btn"
href="${whatsappLink}"
target="_blank"
rel="noopener"
>
📲 استفسار عن الحساب
</a>


<div class="card-site-name">
ALI ALZNTANE
</div>


</article>

`;

}).join("");

}


searchInput.addEventListener(
"input",
()=>{

const text=
searchInput.value
.trim()
.toLowerCase();


if(!text){

renderAccounts(allAccounts);
return;

}


const filtered=
allAccounts.filter(account=>{

const data=[

account.owner,
account.level,
account.price,
account.mythicCount,
account.power,
account.goldenMythic,
account.upgradeWeapons,
account.cars,
account.xSuits,
account.hashtags,
account.friends,
account.popularity,
account.binding

]
.join(" ")
.toLowerCase();


return data.includes(text);

});


renderAccounts(filtered);

});


loadAccounts();

</script>
