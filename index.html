/* إضافة أو تعديل */

window.saveAccount=async function(){

if(!currentUser){

alert("يجب تسجيل الدخول كإدارة أولاً");

return;

}

const owner=document.getElementById("owner").value.trim();

if(!owner){

alert("اكتب صاحب الحساب");

return;

}


const editId=document.getElementById("addModal").dataset.editId || "";

const files=document.getElementById("images").files;

if(files.length>10){

alert("مسموح بحد أقصى 10 صور");

return;

}


const data={

owner:owner,

level:document.getElementById("level").value,

mythic:document.getElementById("mythic").value,

power:document.getElementById("power").value,

golden:document.getElementById("golden").value,

weapons:document.getElementById("weapons").value,

cars:document.getElementById("cars").value,

suits:document.getElementById("suits").value,

hashtags:document.getElementById("hashtags").value,

friends:document.getElementById("friends").value,

popularity:document.getElementById("popularity").value,

binding:document.getElementById("binding").value,

price:document.getElementById("price").value

};


try{

document.getElementById("saveButton").disabled=true;


/* تعديل */

if(editId){

const accountRef=doc(db,"pubgAccounts",editId);

const oldSnap=await getDoc(accountRef);

const oldData=oldSnap.data() || {};

let images=oldData.images || [];


/* إذا تم اختيار صور جديدة */

if(files.length>0){

/* حذف الصور القديمة */

for(const oldImage of images){

try{

if(oldImage.path){

await deleteObject(
ref(storage,oldImage.path)
);

}

}catch(error){}

}


/* رفع الصور الجديدة */

images=[];

for(let i=0;i<files.length;i++){

const file=files[i];

const imageRef=ref(
storage,
"pubg-accounts/"+
Date.now()+"_"+i+"_"+file.name
);

await uploadBytes(imageRef,file);

const url=await getDownloadURL(imageRef);

images.push({

url:url,

path:imageRef.fullPath

});

}

}

data.images=images;

await updateDoc(
accountRef,
data
);

alert("تم تعديل الحساب بنجاح ✅");

}


/* إضافة جديد */

else{

data.images=[];

data.createdAt=Date.now();


for(let i=0;i<files.length;i++){

const file=files[i];

const imageRef=ref(
storage,
"pubg-accounts/"+
Date.now()+"_"+i+"_"+file.name
);

await uploadBytes(imageRef,file);

const url=await getDownloadURL(imageRef);

data.images.push({

url:url,

path:imageRef.fullPath

});

}


await addDoc(
collection(db,"pubgAccounts"),
data
);

alert("تم إضافة الحساب بنجاح ✅");

}


closeAddModal();

clearForm();

await loadAccounts();


}catch(error){

console.error(error);

alert("حدث خطأ أثناء حفظ الحساب");

}finally{

document.getElementById("saveButton").disabled=false;

}

}


/* تحميل الحسابات */

async function loadAccounts(){

const container=document.getElementById("accounts");

container.innerHTML=
'<div class="loading">جاري تحميل الحسابات...</div>';


try{

const q=query(
collection(db,"pubgAccounts"),
orderBy("createdAt","desc")
);

const snapshot=await getDocs(q);

allAccounts=[];


snapshot.forEach((item)=>{

allAccounts.push({

id:item.id,

...item.data()

});

});


renderAccounts(allAccounts);


}catch(error){

console.error(error);

container.innerHTML=
'<div class="empty">تعذر تحميل الحسابات</div>';

}

}

container.innerHTML=
'<div class="empty">لا توجد حسابات مضافة حالياً</div>';

container.innerHTML="";


accounts.forEach(account=>{

let images="";


if(account.images && account.images.length){

images=`

<div class="account-images">

${account.images.map(img=>`

<img
src="${escapeHTML(img.url)}"
alt="صورة حساب PUBG"
onclick="window.open('${escapeHTML(img.url)}','_blank')"
>

`).join("")}

</div>

`;

}


const card=document.createElement("div");

card.className="account";


card.innerHTML=`

<h2>🎮 ببجي موبايل العالمية ✅</h2>

${images}

<div class="info">
🏆 <b>لفل:</b>
${escapeHTML(account.level || "-")}

<div class="info">

${escapeHTML(account.mythic || "-")}
&nbsp;&nbsp; | &nbsp;&nbsp;
💪 <b>لفل القوة:</b>
${escapeHTML(account.power || "-")}
</div>

<div class="info">
🟡 <b>الميثك الذهبي:</b>
${escapeHTML(account.golden || "-")}
</div>

<div class="info">
🔫 <b>أسلحة التطوير:</b>
${escapeHTML(account.weapons || "-")}
</div>

<div class="info">
🚗 <b>السيارات:</b>
${escapeHTML(account.cars || "-")}
</div>

<div class="info">
👕 <b>بدلات X:</b>
${escapeHTML(account.suits || "-")}
</div>

<div class="info">
#️⃣ <b>هاشتاقات:</b>
${escapeHTML(account.hashtags || "-")}
</div>

<div class="info">
👥 <b>الرفقاء:</b>
${escapeHTML(account.friends || "-")}
</div>

<div class="info">
📈 <b>مستوى الشعبية:</b>
${escapeHTML(account.popularity || "-")}
</div>

<div class="info">
🔗 <b>الربط:</b>
${escapeHTML(account.binding || "-")}
</div>

<div class="info">
💰 <b>السعر:</b>
${escapeHTML(account.price || "-")}
</div>

<div class="info">
👤 <b>صاحب الحساب:</b>
${escapeHTML(account.owner || "-")}
</div>

${
currentUser
?
`

<button class="edit-btn"
onclick="editAccount('${account.id}')">
✏️ تعديل الحساب
</button>

<button class="delete-btn"
onclick="deleteAccount('${account.id}')">
🗑️ حذف الحساب

""

`;


container.appendChild(card);

});

}

window.filterAccounts=function(){

.value
.trim()
.toLowerCase();

renderAccounts(allAccounts);

return;

}


const filtered=allAccounts.filter(account=>{

return JSON.stringify(account)
.toLowerCase()
.includes(text);

});

}
